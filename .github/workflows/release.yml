name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git describe` can find the previous tag for the compare link.
          fetch-depth: 0

      - name: Read version from PluginMetadata
        id: version
        run: |
          set -euo pipefail
          MAIN_CS="MixScrims/src/Main.cs"
          VERSION=$(sed -n 's/.*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$MAIN_CS" | head -1)

          if [ -z "$VERSION" ]; then
            echo "::error file=$MAIN_CS::Could not read PluginMetadata.Version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION -> tag v$VERSION"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump PluginMetadata.Version in MixScrims/src/Main.cs."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # Print the body of the matching "## [x.y.z]" section, stopping at the next one.
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[v?" ver "\\]") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error file=CHANGELOG.md::No '## [$VERSION]' section found."
            exit 1
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "${{ github.repository }}" "$PREV_TAG" "${{ steps.version.outputs.tag }}" >> release-notes.md
          fi

          cat release-notes.md

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Publish
        run: |
          set -euo pipefail
          dotnet restore MixScrims/MixScrims.csproj
          dotnet publish MixScrims/MixScrims.csproj -c Release

      - name: Collect plugin zip
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # Produced by the csproj's CreateZip target, which reads the same Main.cs version.
          # Lands in build/ because OutputPath picks up the TFM, so $(OutputPath)../ is build/.
          PLUGIN_ZIP="MixScrims/build/MixScrims-v${VERSION}.zip"

          if [ ! -f "$PLUGIN_ZIP" ]; then
            echo "::error::Expected $PLUGIN_ZIP from the CreateZip target. Zips found:"
            find . -name '*.zip' -type f || true
            exit 1
          fi

          mkdir -p release-artifacts
          cp "$PLUGIN_ZIP" release-artifacts/
          ls -l release-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          PRERELEASE=()
          case "$VERSION" in
            *-*) PRERELEASE=(--prerelease) ;;
          esac

          # GitHub attaches "Source code (zip)" and "(tar.gz)" to the tag automatically,
          # so only the published plugin zip is uploaded here.
          gh release create "$TAG" \
            --title "MixScrims | $TAG" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" \
            "${PRERELEASE[@]}" \
            release-artifacts/*.zip

          echo "Released $TAG"

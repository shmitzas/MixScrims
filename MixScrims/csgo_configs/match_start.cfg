// Restores ONLY the cvars that warmup.cfg / teampick.cfg / knife_round.cfg change.
// Everything else lives in match_base.cfg, exec'd once per map load.
//
// Exec'ing the full 112-cvar set here stalled the server 2-4s at EVERY match start:
// the engine skipped 130-240 ticks and every client logged `high frame misdelivery`.
// Keep this file small - a cvar no pre-match cfg touches belongs in match_base.cfg.

mp_match_end_changelevel                           0
sv_allow_votes                                     0

// Order matters: CS2 ignores mp_warmup_end while the warmup timer is paused, and a warmup
// that is still set swallows the round transition StartMatch drives right after this exec.
mp_warmup_pausetimer                               0
mp_warmuptime                                      0
mp_warmup_end

mp_limitteams                                      0
mp_unpause_match

mp_freezetime                                      15
mp_friendlyfire                                    1
mp_free_armor                                      0
mp_respawn_immunitytime                            -1
mp_maxmoney                                        16000
mp_startmoney                                      800
mp_maxrounds                                       24
mp_round_restart_delay                             7
mp_give_player_c4                                  1
mp_death_drop_gun                                  1
mp_default_team_winner_no_objective                -1
mp_weapons_allow_typecount                         5
mp_buy_anywhere                                    0
mp_ct_default_secondary                            weapon_hkp2000
mp_t_default_secondary                             weapon_glock
sv_alltalk                                         0
sv_talk_enemy_living                               0
sv_talk_enemy_dead                                 0

